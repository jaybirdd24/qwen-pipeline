[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-voice-pipeline"
version = "0.2.0"
description = "Cached bilingual Qwen3-TTS story-pack generator"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.24,<3",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
  "soundfile>=0.12,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
qwen = ["huggingface-hub>=0.34,<2", "qwen-tts==0.1.1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
story-pipeline = "story_voice_pipeline.cli:main"
story-control-service = "story_voice_pipeline.control_service.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"story_voice_pipeline.control_service" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
